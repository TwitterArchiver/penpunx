  <div class="tweet-content">
  语文已经因为我们错乱的的的使用而哭晕在厕所里了，且还未醒过来地。我们必须即刻、立马、马上即使的展开行动，不然将来回想起来的那一刻，已成为过去式的语言将不复存在于记忆之中了！
  <br/>
  请大家自觉规范自己的的语句，别再用“既即不分”“以己乱以已”“在再傻傻分不清”的方式来玷污文字本来的的高贵！

<script>
var dateString = "2025-10-02T15:22:49.000Z";

  document.querySelector("#parentdate").href = currentURL;
