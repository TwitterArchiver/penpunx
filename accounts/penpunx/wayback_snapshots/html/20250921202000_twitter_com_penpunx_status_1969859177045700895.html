  .tweet-author {

    max-height: 48px;

			}

  <div class="tweet-content">
  当我倾诉完自己的感受，哪怕对方并不在线，我都会立马觉得自己不再难受了，并且开始关注自己已经有了什么。“知足常乐”是一句笼统的口号，可是今天我找到了具体方法：先看到和接纳自己未被满足的情绪，也许不需要别人的回应和关心，但是要先自我承认，允许它的存在。

<script>
var dateString = "2025-09-21T20:20:00.000Z";

  document.querySelector("#parentdate").href = currentURL;
